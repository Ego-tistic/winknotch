name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Windows app
        shell: powershell
        run: .\build.ps1
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: artifacts/WinTide.exe
          if-no-files-found: error
